<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes</title>
<style>
:root{--ac:#39ffb4;--f:system-ui,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#07060d;color:#eee;font:15px/1.5 var(--f);height:100vh;overflow:hidden}
#bg,#bgi{position:fixed;inset:0;width:100%;height:100%;z-index:-2;background-size:cover;background-position:center}
#bgi{z-index:-1}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
input,select{background:#0006;border:1px solid #fff3;border-radius:10px;padding:8px 12px}
select option{color:#000}
svg.i{width:22px;height:22px;stroke:var(--ac);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#top{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#0a0814cc;backdrop-filter:blur(8px);z-index:5}
#q{flex:1;max-width:560px;margin:0 auto;height:38px;border-radius:20px;padding:0 16px;outline:0}
#q:focus{border-color:var(--ac)}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ac)}
#side{position:fixed;top:56px;left:0;bottom:0;width:72px;padding-top:8px;background:#0a0814cc;backdrop-filter:blur(8px);z-index:4;display:flex;flex-direction:column;align-items:center;gap:4px}
#side a{display:flex;flex-direction:column;align-items:center;gap:2px;width:64px;padding:10px 0;border-radius:12px;font-size:10px;color:#ccc;text-decoration:none}
#side a:hover,#side a.on{background:#fff1}
#main{position:absolute;top:56px;left:72px;right:0;bottom:0;overflow:auto;padding:20px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.c{border-radius:12px;overflow:hidden;background:#0a0814aa;cursor:pointer;position:relative;border:1px solid #fff1}
.c:hover{border-color:var(--ac)}
.th{aspect-ratio:16/9;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 35%,#0b0b18),#2a1a5e);display:grid;place-items:center;font-size:42px;color:#fff9;background-size:cover;background-position:center}
.ct{padding:10px 12px}.ct b{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tgs{color:var(--ac);font-size:12px;min-height:18px}
.eb{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:#000a;display:grid;place-items:center;opacity:0}
.c:hover .eb{opacity:1}@media(hover:none){.eb{opacity:1}}
.bt{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:18px;border:1px solid var(--ac);color:var(--ac);margin:4px 4px 4px 0}
.bt:hover{background:#fff1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips a{padding:4px 12px;border-radius:14px;background:#fff1;color:var(--ac);text-decoration:none}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
#nt{width:100%;background:none;border:0;border-bottom:1px solid #fff2;border-radius:0;font-size:26px;font-weight:700;padding:8px 0;outline:0;margin-bottom:8px}
#ed{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:calc(100% - 110px);min-height:300px}
#nb{resize:none;background:#0005;border:1px solid #fff2;border-radius:12px;padding:14px;outline:0}
#pv{white-space:pre-wrap;word-break:break-word;background:#0005;border-radius:12px;padding:14px;overflow:auto}
#pv h1,#pv h2,#pv h3{margin:.3em 0}
.ni{max-width:100%;border-radius:10px;display:block;margin:8px 0}
.lk{display:inline-flex;align-items:center;gap:6px;padding:3px 14px;border-radius:16px;background:#fff1;border:1px solid var(--ac);color:var(--ac);text-decoration:none}
.lk::after{content:"\2197"}
.wl{color:var(--ac)}.tg{color:var(--ac);text-decoration:none}
code{background:#fff2;padding:1px 5px;border-radius:5px}
#gc{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.hint{position:absolute;left:16px;top:12px;font-size:12px;color:#fffa;pointer-events:none}
.zb{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px}
.zb button{width:40px;height:40px;border-radius:50%;background:#0008;border:1px solid var(--ac);color:var(--ac);font-size:20px}
@media(max-width:900px){#ed{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
@media(max-width:700px){#side{top:auto;right:0;width:auto;height:58px;flex-direction:row;justify-content:space-around;padding:0}#main{left:0;bottom:58px}}
</style></head><body>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const L=(k,d)=>{try{return JSON.parse(localStorage[k])||d}catch{return d}};
const S=(k,v)=>{try{localStorage[k]=JSON.stringify(v)}catch{alert('Storage full')}};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/>',graph:'<circle cx="12" cy="12" r="2.5"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="7" r="2"/><circle cx="17" cy="19" r="2"/><path d="M10 11L6.5 7.5M14 11l3.5-3M13.5 14l2.5 3.5"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',plus:'<path d="M12 5v14M5 12h14"/>',link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',font:'<path d="M5 20L12 4l7 16M8 14h8"/>'};
const ic=k=>`<svg class="i" viewBox="0 0 24 24">${IC[k]}</svg>`;
let N=L('n2',[]),P=L('pics',[]),C=Object.assign({ac:'#39ffb4',bg:'g1',fonts:[],font:''},L('cfg',{}));
const save=()=>S('n2',N),mk=t=>{const n={id:uid(),t:t||'',b:'',c:Date.now(),u:Date.now(),th:''};N.unshift(n);save();return n};
if(!localStorage.n2){const o=L('notes.v1',[]);N=Array.isArray(o)?o.map(x=>({id:uid(),t:x.title||x.t||'Untitled',b:x.body||x.text||x.b||x.content||'',c:Date.now(),u:Date.now(),th:''})):[];
 if(!N.length)N=[{id:uid(),t:'Welcome',b:'# Welcome #start\nAdd a picture: use the Image button, or paste / drop one here.\nLink block: [Shopee](https://shopee.com)\nLink notes: [[Another note]]\nClick the picture icon on a home card to set its thumbnail.',c:Date.now(),u:Date.now(),th:''}];save()}
/* ---- storage for big files (pictures, gifs, fonts) ---- */
const DB=new Promise(r=>{const q=indexedDB.open('nb',1);q.onupgradeneeded=()=>q.result.createObjectStore('b');q.onsuccess=()=>r(q.result)});
const tx=async(m,f)=>{const d=await DB;return new Promise((ok,no)=>{const q=f(d.transaction('b',m).objectStore('b'));q.onsuccess=()=>ok(q.result);q.onerror=no})};
const dbp=(k,v)=>tx('readwrite',s=>s.put(v,k)),dbg=k=>tx('readonly',s=>s.get(k)),dbd=k=>tx('readwrite',s=>s.delete(k));
const U={};
async function url(id){if(U[id])return U[id];const b=await dbg(id);return b?U[id]=URL.createObjectURL(b):''}
function fill(el){el.querySelectorAll('[data-i]').forEach(async e=>{const u=await url(e.dataset.i);e.tagName=='IMG'?e.src=u:e.style.backgroundImage=`url(${u})`})}
const MAX=20*1048576;
function pick(acc,multi,cb){const i=document.createElement('input');i.type='file';i.accept=acc;i.multiple=multi;i.onchange=()=>cb([...i.files]);i.click()}
async function addPic(f){if(f.size>MAX){alert(f.name+' is over 20MB');return}const id=uid();await dbp(id,f);P.push({id,n:f.name,s:f.size});S('pics',P);return id}
const pickTh=id=>pick('image/*',0,async([f])=>{if(!f)return;const p=await addPic(f);if(p){N.find(n=>n.id==id).th=p;save();render()}});
/* ---- text helpers ---- */
const tg=n=>[...new Set((n.b.match(/(?:^|\s)#[\w-]+/g)||[]).map(x=>x.trim().slice(1)))];
function md(s){s=esc(s);
 s=s.replace(/!\[([^\]]*)\]\(img:(\w+)\)/g,'<img class="ni" data-i="$2" alt="$1">')
 .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a class="lk" href="$2" target="_blank" rel="noopener">$1</a>')
 .replace(/\[\[([^\]]+)\]\]/g,(m,t)=>`<a class="wl" href="#/t/${encodeURIComponent(t)}">${t}</a>`)
 .replace(/^(#{1,3}) (.+)$/gm,(m,h,t)=>`<h${h.length}>${t}</h${h.length}>`)
 .replace(/(^|\s)#([\w-]+)/g,'$1<a class="tg" href="#/s/%23$2">#$2</a>')
 .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>')
 .replace(/^- (.+)$/gm,'• $1').replace(/(<\/h\d>)\n/g,'$1');return s}
const card=n=>`<div class="c" data-n="${n.id}"><div class="th"${n.th?` data-i="${n.th}"`:''}>${n.th?'':esc((n.t||'?')[0].toUpperCase())}</div><button class="eb" data-th="${n.id}" title="Set thumbnail">${ic('img')}</button><div class="ct"><b>${esc(n.t||'Untitled')}</b><div class="tgs">${tg(n).map(t=>'#'+t).join(' ')}</div></div></div>`;
/* ---- views ---- */
const M_=()=>$('#main');
function vHome(){const T=[...new Set(N.flatMap(tg))];M.innerHTML=`<div class="chips">${T.map(t=>`<a href="#/s/${encodeURIComponent('#'+t)}">#${esc(t)}</a>`).join('')}</div><div class="g">${[...N].sort((a,b)=>(b.u||0)-(a.u||0)).map(card).join('')||'<p>No notes yet. Press + to start.</p>'}</div>`}
function vSearch(q){if($('#q').value!=q)$('#q').value=q;const w=q.toLowerCase().split(/\s+/).filter(Boolean),R=N.filter(n=>{const s=(n.t+' '+n.b).toLowerCase();return w.every(k=>s.includes(k))});M.innerHTML=`<p>${R.length} result(s)</p><div class="g">${R.map(card).join('')}</div>`}
function vTitle(t){const n=N.find(n=>n.t.toLowerCase()==t.toLowerCase())||mk(t);location.replace('#/n/'+n.id)}
function vPics(){M.innerHTML=`<div class="bar"><h2>Pictures</h2><button class="bt" id="up">${ic('plus')} Add picture (max 20MB, GIF ok)</button></div><div class="g">${P.map(p=>`<div class="c"><div class="th" data-i="${p.id}"></div><div class="ct"><b>${esc(p.n)}</b><button class="bt" data-cp="${p.id}">Copy code</button><button class="bt" data-dp="${p.id}">Delete</button></div></div>`).join('')||'<p>No pictures yet. Drop files here.</p>'}</div>`;
 $('#up').onclick=()=>pick('image/*',1,async fs=>{for(const f of fs)await addPic(f);render()})}
function vNote(id){const n=N.find(x=>x.id==id);if(!n){M.innerHTML='<p>Note not found.</p>';return}
 M.innerHTML=`<input id="nt" placeholder="Title"><div><button class="bt" id="bi">${ic('img')} Image</button><button class="bt" id="bl">${ic('link')} Link</button><button class="bt" id="bt">${ic('img')} Thumbnail</button><button class="bt" id="bd">Delete</button></div><div id="ed"><textarea id="nb" placeholder="Write... #tags  [[Note]]"></textarea><div id="pv"></div></div>`;
 const ta=$('#nb'),pv=$('#pv');$('#nt').value=n.t;ta.value=n.b;
 const up=()=>{pv.innerHTML=md(ta.value);fill(pv)},ins=s=>{ta.setRangeText(s,ta.selectionStart,ta.selectionEnd,'end');ta.dispatchEvent(new Event('input'))};
 const img=async f=>{if(!f||!f.type.startsWith('image/'))return;const i=await addPic(f);if(i)ins(`\n![](img:${i})\n`)};
 ta.oninput=()=>{n.b=ta.value;n.u=Date.now();save();up()};up();
 ta.onpaste=e=>{const f=e.clipboardData.files[0];if(f&&f.type.startsWith('image/')){e.preventDefault();img(f)}};
 ta.ondrop=e=>{e.preventDefault();img(e.dataTransfer.files[0])};
 $('#nt').oninput=e=>{n.t=e.target.value;n.u=Date.now();save()};
 $('#bi').onclick=()=>pick('image/*',0,([f])=>img(f));
 $('#bl').onclick=()=>{let u=prompt('Paste the link');if(!u)return;if(!/^https?:/.test(u))u='https://'+u;ins(`[${prompt('Name to show (e.g. Shopee)')||u}](${u})`)};
 $('#bt').onclick=()=>pickTh(n.id);
 $('#bd').onclick=()=>{if(confirm('Delete this note?')){N=N.filter(x=>x!=n);save();location.hash='#/'}}}
function vSet(){M.innerHTML=`<h2>Settings</h2><h3>Icon color</h3><input type="color" id="ac" value="${C.ac}"><h3>Font</h3><select id="fs"><option value="">Default</option>${C.fonts.map(f=>`<option value="u:${f.id}">${esc(f.n)}</option>`).join('')}</select> <button class="bt" id="fu">${ic('font')} Add font file</button><br><input id="fn" placeholder="or type an installed font name"><h3>Background</h3><div>${[['g0','Dark'],['g1','Galaxy 1'],['g2','Galaxy 2'],['g3','Galaxy 3']].map(([k,n])=>`<button class="bt" data-bg="${k}">${n}</button>`).join('')}<button class="bt" id="bu">${ic('img')} My picture</button></div><h3>Backup</h3><button class="bt" id="ex">Export notes (.json)</button>`;
 $('#fs').value=C.font.startsWith('u:')?C.font:'';
 $('#ac').oninput=e=>{C.ac=e.target.value;S('cfg',C);cfg()};
 $('#fs').onchange=e=>{C.font=e.target.value;S('cfg',C);cfg()};
 $('#fn').onchange=e=>{C.font=e.target.value?'s:'+e.target.value:'';S('cfg',C);cfg()};
 $('#fu').onclick=()=>pick('.ttf,.otf,.woff,.woff2',0,async([f])=>{if(!f||f.size>MAX)return;const id=uid(),o={id,n:f.name.replace(/\.\w+$/,'')};await dbp(id,f);C.fonts.push(o);C.font='u:'+id;S('cfg',C);await loadFonts([o]);cfg();render()});
 $('#bu').onclick=()=>pick('image/*',0,async([f])=>{if(!f)return;const i=await addPic(f);if(i){C.bg='c:'+i;S('cfg',C);bg()}});
 $('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(N)],{type:'application/json'}));a.download='notes.json';a.click()}}
/* ---- 3D graph ---- */
let raf;
function vGraph(){if(!N.length){M.innerHTML='<p>No notes yet.</p>';return}
 M.innerHTML='<canvas id="gc"></canvas><div class="hint">Drag = rotate · wheel / + − = zoom · click a dot = open</div><div class="zb"><button id="zi">+</button><button id="zo">−</button></div>';
 const cv=$('#gc'),x=cv.getContext('2d'),idx={},E=[];
 N.forEach((n,i)=>idx[n.t.toLowerCase()]=i);
 N.forEach((n,i)=>(n.b.match(/\[\[([^\]]+)\]\]/g)||[]).forEach(m=>{const j=idx[m.slice(2,-2).toLowerCase()];if(j!=null&&j!=i)E.push([i,j])}));
 const V=N.map(()=>{const a=Math.random()*6.28,b=Math.acos(2*Math.random()-1);return[150*Math.sin(b)*Math.cos(a),150*Math.sin(b)*Math.sin(a),150*Math.cos(b)]}),R3=[0,1,2];
 for(let k=0;k<200;k++){const F=V.map(()=>[0,0,0]);
  for(let i=0;i<V.length;i++){R3.forEach(a=>F[i][a]-=V[i][a]*.01);for(let j=i+1;j<V.length;j++){const d=R3.map(a=>V[i][a]-V[j][a]),s=d[0]**2+d[1]**2+d[2]**2+100,f=9000/s/Math.sqrt(s);R3.forEach(a=>{F[i][a]+=d[a]*f;F[j][a]-=d[a]*f})}}
  E.forEach(([i,j])=>{const d=R3.map(a=>V[j][a]-V[i][a]),l=Math.hypot(...d)||1,f=(l-90)/l*.05;R3.forEach(a=>{F[i][a]+=d[a]*f;F[j][a]-=d[a]*f})});
  V.forEach((v,i)=>R3.forEach(a=>v[a]+=F[i][a]*.5))}
 let ya=0,xa=.3,zm=1,dr=0,mv=0,lx=0,ly=0,hov=-1,PP=[];
 const draw=()=>{const w=M.clientWidth,h=M.clientHeight;if(cv.width!=w)cv.width=w;if(cv.height!=h)cv.height=h;x.clearRect(0,0,w,h);if(!dr)ya+=.002;
  const cy=Math.cos(ya),sy=Math.sin(ya),cx=Math.cos(xa),sx=Math.sin(xa);
  PP=V.map((v,i)=>{const a=v[0]*cy+v[2]*sy;let z=-v[0]*sy+v[2]*cy;const b=v[1]*cx-z*sx;z=v[1]*sx+z*cx;const s=zm*600/(600+z);return[w/2+a*s,h/2+b*s,z,s,i]});
  x.strokeStyle=C.ac;x.lineWidth=1;x.globalAlpha=.3;E.forEach(([i,j])=>{x.beginPath();x.moveTo(PP[i][0],PP[i][1]);x.lineTo(PP[j][0],PP[j][1]);x.stroke()});
  x.shadowColor=C.ac;x.shadowBlur=12;const ff=getComputedStyle(document.body).fontFamily;
  [...PP].sort((a,b)=>b[2]-a[2]).forEach(p=>{const r=(p[4]==hov?9:5)*p[3];x.globalAlpha=Math.min(1,.3+p[3]*.5);x.fillStyle=C.ac;x.beginPath();x.arc(p[0],p[1],r,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.font=`${10+p[3]*3}px ${ff}`;x.fillText(N[p[4]].t||'Untitled',p[0]+r+4,p[1]+4);x.shadowBlur=12});
  x.globalAlpha=1;x.shadowBlur=0;raf=requestAnimationFrame(draw)};draw();
 cv.onpointerdown=e=>{dr=1;mv=0;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)};
 cv.onpointermove=e=>{if(dr){const dx=e.clientX-lx,dy=e.clientY-ly;ya+=dx*.008;xa+=dy*.008;mv+=Math.abs(dx)+Math.abs(dy);lx=e.clientX;ly=e.clientY}else{const r=cv.getBoundingClientRect();hov=-1;let best=16;PP.forEach(p=>{const d=Math.hypot(p[0]-e.clientX+r.left,p[1]-e.clientY+r.top);if(d<best){best=d;hov=p[4]}});cv.style.cursor=hov>=0?'pointer':'grab'}};
 cv.onpointerup=e=>{dr=0;if(mv<6){const r=cv.getBoundingClientRect();let b=-1,best=18;PP.forEach(p=>{const d=Math.hypot(p[0]-e.clientX+r.left,p[1]-e.clientY+r.top);if(d<best){best=d;b=p[4]}});if(b>=0)location.hash='#/n/'+N[b].id}};
 cv.onwheel=e=>{e.preventDefault();zm=Math.min(4,Math.max(.3,zm*(e.deltaY<0?1.1:.9)))};
 $('#zi').onclick=()=>zm=Math.min(4,zm*1.25);$('#zo').onclick=()=>zm=Math.max(.3,zm*.8)}
/* ---- theme: font, color, background ---- */
async function loadFonts(l=C.fonts){for(const f of l){const b=await dbg(f.id);if(!b)continue;try{const ff=new FontFace('F'+f.id,await b.arrayBuffer());await ff.load();document.fonts.add(ff)}catch{}}}
function cfg(){const r=document.documentElement.style,f=C.font;r.setProperty('--ac',C.ac);r.setProperty('--f',(f?(f[0]=='u'?'F'+f.slice(2):`"${f.slice(2)}"`)+',':'')+'system-ui,"Segoe UI",Roboto,sans-serif')}
const BG={g1:['#0b0620','#7a3cff','#ff4fa3'],g2:['#020a1c','#1f7bff','#19e6d0'],g3:['#12040a','#ff6a2a','#b21fff']};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function bg(){const c=$('#bg'),d=$('#bgi'),k=C.bg;d.style.backgroundImage='';c.style.display='block';
 if(k.startsWith('c:')){c.style.display='none';url(k.slice(2)).then(u=>d.style.backgroundImage=`url(${u})`);return}
 const w=c.width=innerWidth,h=c.height=innerHeight,x=c.getContext('2d'),p=BG[k];x.fillStyle=p?p[0]:'#07060d';x.fillRect(0,0,w,h);if(!p)return;
 const r=rng(k.charCodeAt(1)*99);
 [[.3,.35,.5,p[1]],[.75,.65,.45,p[2]],[.55,.2,.3,p[1]]].forEach(([a,b,s,col])=>{const g=x.createRadialGradient(w*a,h*b,0,w*a,h*b,Math.max(w,h)*s);g.addColorStop(0,col+'88');g.addColorStop(1,'#0000');x.fillStyle=g;x.fillRect(0,0,w,h)});
 for(let i=0;i<500;i++){x.fillStyle=`rgba(255,255,255,${r()*.8+.2})`;const s=r()*1.7;x.fillRect(r()*w,r()*h,s,s)}}
/* ---- router + start ---- */
let M;
function render(){cancelAnimationFrame(raf);const h=location.hash.slice(2).split('/'),r=h[0]||'',a=decodeURIComponent(h.slice(1).join('/'));M.style.padding=r=='graph'?0:'';M.scrollTop=0;
